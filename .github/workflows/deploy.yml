name: Deploy

on:
  push:
    branches: [staging, main]

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
      moving_tag: ${{ steps.vars.outputs.moving_tag }}
    steps:
      - uses: actions/checkout@v4

      - id: vars
        run: |
          echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "moving_tag=prod" >> "$GITHUB_OUTPUT"
          else
            echo "moving_tag=staging" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push imagem de runtime
        uses: docker/build-push-action@v5
        with:
          context: .
          target: runner
          platforms: linux/amd64
          provenance: false
          push: true
          tags: |
            ghcr.io/zelitosaide/plagea:${{ steps.vars.outputs.tag }}
            ghcr.io/zelitosaide/plagea:${{ steps.vars.outputs.moving_tag }}

      - name: Build + push imagem de ferramentas (migrações)
        uses: docker/build-push-action@v5
        with:
          context: .
          target: builder
          platforms: linux/amd64
          provenance: false
          push: true
          tags: |
            ghcr.io/zelitosaide/plagea:${{ steps.vars.outputs.tag }}-tools
            ghcr.io/zelitosaide/plagea:${{ steps.vars.outputs.moving_tag }}-tools

  deploy-staging:
    needs: build-and-push
    if: github.ref_name == 'staging'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Sincronizar docker-compose.yml
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.STAGING_HOST }}
          port: 8899
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          source: "docker-compose.yml"
          target: "/srv/plagea/staging/"

      - name: Sincronizar deploy.sh
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.STAGING_HOST }}
          port: 8899
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          source: "deploy/deploy.sh"
          target: "/srv/plagea/staging/"
          strip_components: 1

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_HOST }}
          port: 8899
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            chmod +x /srv/plagea/staging/deploy.sh
            /srv/plagea/staging/deploy.sh staging ${{ needs.build-and-push.outputs.tag }}

  deploy-production:
    needs: build-and-push
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Sincronizar docker-compose.yml
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          port: 8899
          username: ${{ secrets.PRODUCTION_SSH_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          source: "docker-compose.yml"
          target: "/srv/plagea/production/"

      - name: Sincronizar deploy.sh
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          port: 8899
          username: ${{ secrets.PRODUCTION_SSH_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          source: "deploy/deploy.sh"
          target: "/srv/plagea/production/"
          strip_components: 1

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          port: 8899
          username: ${{ secrets.PRODUCTION_SSH_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          script: |
            chmod +x /srv/plagea/production/deploy.sh
            /srv/plagea/production/deploy.sh production ${{ needs.build-and-push.outputs.tag }}
