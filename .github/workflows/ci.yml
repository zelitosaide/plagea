name: CI

on:
  pull_request:
  push:
    branches: [main, staging]

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # next.config.mjs tem typescript.ignoreBuildErrors: true, por isso o
      # "next build" por si só não apanha erros de tipo — este passo é o
      # que realmente valida os tipos.
      - name: Verificação de tipos
        run: pnpm exec tsc --noEmit

      - name: Build Next.js
        run: pnpm run build

      - name: Build da imagem Docker (estágio runner)
        run: docker build --target runner -t plagea-app:ci .
